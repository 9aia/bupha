# cypera — org docs/reference generation contract (see ../cypera).
# Discovered upward from the repo root; `bun run docs:gen` inside
# docs/ drives `cypera gen crate-map|cli|config` with no flags.

[crate_map]
order = ["domain", "port", "adapter", "binary"]

[crate_map.layers]
"bupha" = "binary"
"bupha-core" = "domain"
"bupha-runner" = "port"
"bupha-tunnel" = "port"
"bupha-trigger" = "port"
"bupha-status" = "port"
"bupha-vcs" = "port"
"bupha-queue" = "port"
"bupha-service" = "port"
"bupha-secret" = "port"
"bupha-cache" = "port"
"bupha-access" = "port"
"bupha-telemetry" = "port"
"bupha-attest" = "port"
"bupha-queue-lease" = "port"

[[crate_map.splices]]
target = "docs/explanation/architecture.md"
first_table = true

[crate_map.crate_api]
site = "bupha"
out = "docs/reference/crate-api.md"

[cli]
package = "bupha-driver"
bin = "tamias-driver-bupha"
prefix = ["run"]
out = "docs/reference/cli.md"

[config]
title = "Config — `bupha.yaml` / `bupha.toml`"
out = "docs/reference/config.md"
types = { "String" = "string", "PathBuf" = "path", "bool" = "bool", "u16" = "int", "usize" = "int", "Vec<String>" = "list", "QueuePolicy" = "\"latest\" | \"all\"" }

[[config.structs]]
file = "crates/bupha-core/src/lib.rs"
name = "Config"
title = "Top level"
[[config.structs]]
file = "crates/bupha-core/src/lib.rs"
name = "RepoEntry"
title = "`[[repo]]`"
[[config.structs]]
file = "crates/bupha-core/src/lib.rs"
name = "TriggerCfg"
title = "`[trigger]`"
[[config.structs]]
file = "crates/bupha-core/src/lib.rs"
name = "RunnerCfg"
title = "`[runner]`"
[[config.structs]]
file = "crates/bupha-core/src/lib.rs"
name = "StatusCfg"
title = "`[status]`"
[[config.structs]]
file = "crates/bupha-core/src/lib.rs"
name = "TunnelCfg"
title = "`[tunnel]`"
[[config.structs]]
