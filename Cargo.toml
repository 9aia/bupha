[workspace]
resolver = "2"
members = [
    "crates/bupha-cli",
    "crates/bupha-systemd",
    "crates/bupha-core",
    "crates/bupha-trigger",
    "crates/bupha-vcs",
    "crates/bupha-git",
    "crates/bupha-queue",
    "crates/bupha-queue-redb",
    "crates/bupha-service",
    "crates/bupha-secret",
    "crates/bupha-keyring",
    "crates/bupha-dotenv",
    "crates/bupha-config",
    "crates/bupha-config-toml",
    "crates/bupha-cache",
    "crates/bupha-cache-sccache",
    "crates/bupha-ssh",
    "crates/bupha-status",
    "crates/bupha-github",
    "crates/bupha-runner",
    "crates/bupha-dagger",
    "crates/bupha-shell",
    "crates/bupha-tunnel",
    "crates/bupha-cloudflared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/bupha"
description = "The oxpecker on your repo's back — headless CI: watch, queue, run, report"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
bupha-core = { path = "crates/bupha-core", version = "0.1.0" }
bupha-trigger = { path = "crates/bupha-trigger", version = "0.1.0" }
bupha-vcs = { path = "crates/bupha-vcs", version = "0.1.0" }
bupha-git = { path = "crates/bupha-git", version = "0.1.0" }
bupha-queue = { path = "crates/bupha-queue", version = "0.1.0" }
bupha-queue-redb = { path = "crates/bupha-queue-redb", version = "0.1.0" }
bupha-service = { path = "crates/bupha-service", version = "0.1.0" }
bupha-secret = { path = "crates/bupha-secret", version = "0.1.0" }
bupha-keyring = { path = "crates/bupha-keyring", version = "0.1.0" }
bupha-dotenv = { path = "crates/bupha-dotenv", version = "0.1.0" }
bupha-config = { path = "crates/bupha-config", version = "0.1.0" }
bupha-config-toml = { path = "crates/bupha-config-toml", version = "0.1.0" }
bupha-cache = { path = "crates/bupha-cache", version = "0.1.0" }
bupha-cache-sccache = { path = "crates/bupha-cache-sccache", version = "0.1.0" }
bupha-ssh = { path = "crates/bupha-ssh", version = "0.1.0" }
serde_json = "1"
bupha-status = { path = "crates/bupha-status", version = "0.1.0" }
bupha-runner = { path = "crates/bupha-runner", version = "0.1.0" }
bupha-tunnel = { path = "crates/bupha-tunnel", version = "0.1.0" }
bupha-dagger = { path = "crates/bupha-dagger", version = "0.1.0" }
bupha-shell = { path = "crates/bupha-shell", version = "0.1.0" }
bupha-github = { path = "crates/bupha-github", version = "0.1.0" }
bupha-cloudflared = { path = "crates/bupha-cloudflared", version = "0.1.0" }
bupha-systemd = { path = "crates/bupha-systemd", version = "0.1.0" }
