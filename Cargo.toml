[workspace]
resolver = "2"
members = [
    "crates/bupha-attest-sigstore",
    "crates/bupha-attest-file",
    "crates/bupha-history",
    "crates/bupha-attest",
    "crates/bupha-container",
    "crates/bupha-telemetry-otel",
    "crates/bupha-telemetry",
    "crates/bupha-access-forge",
    "crates/bupha-access-file",
    "crates/bupha-access",
    "crates/bupha-audit-file",
    "crates/bupha-cli",
    "crates/bupha-systemd",
    "crates/bupha-core",
    "crates/bupha-trigger",
    "crates/bupha-gha",
    "crates/bupha-gha-runner",
    "crates/bupha-queue",
    "crates/bupha-service",
    "crates/bupha-secret",
    "crates/bupha-secret-cuora",
    "crates/bupha-keyring",
    "crates/bupha-dotenv",
    "crates/bupha-config",
    "crates/bupha-config-file",
    "crates/bupha-config-toml",
    "crates/bupha-config-yaml",
    "crates/bupha-cache",
    "crates/bupha-cache-sccache",
    "crates/bupha-ssh",
    "crates/bupha-status",
    "crates/bupha-github",
    "crates/bupha-runner",
    "crates/bupha-dagger",
    "crates/bupha-shell",
    "crates/bupha-tunnel",
    "crates/bupha-cloudflared",
    "crates/bupha-http",
    "crates/bupha-sturn",
    "crates/bupha-webhook",
    "crates/bupha-watch",
    "crates/bupha-driver",
    "crates/bupha-plane",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/bupha"
description = "Queue engine for event-driven jobs — shipped as CI"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
bupha-attest-sigstore = { path = "crates/bupha-attest-sigstore", version = "0.2.0" }
