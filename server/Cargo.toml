[package]
name = "handl-ci-watch"
version = "0.1.0"
edition = "2021"
description = "GitHub push webhook receiver that runs the handl-lang Dagger CI pipeline per commit"

[dependencies]
tiny_http = "0.12"
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3", features = ["json"] }
