name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: set workspace version from tag
        run: sed -i '0,/^version = /s//version = "${GITHUB_REF_NAME#v}"/' Cargo.toml
      - name: publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          for c in bupha-core bupha-runner bupha-tunnel bupha-dagger \
                   bupha-script bupha-github bupha-cloudflared \
                   bupha-deploy bupha; do
            for i in 1 2 3 4 5; do
              cargo publish -p "$c" --allow-dirty && break || sleep 30
            done
          done
