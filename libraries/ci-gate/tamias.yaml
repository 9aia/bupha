# ci-gate — the org CI gate as a tamias `bupha` bundle.
#
# `tamias install <ref>` fetches this payload; `tamias deploy ci-gate`
# renders the provider units (`bupha-watch.service` running
# `tamias-driver-bupha host --config ~/.config/bupha/bundles/ci-gate.toml`
# for standalone mode, `bupha-worker.service` running the `worker`
# verb against the same config for the peregrin substrate path) and
# `tamias-driver-bupha deploy` writes that operator config from
# `fleet.toml` + this manifest's `provider.ingress` block.
# `tamias driver exec ci-gate hooks register` points the declared
# GitHub webhooks at the public URL.
name: ci-gate
version: "0.3.5"
type: bupha
description: >-
  Push-to-verdict CI gate: GitHub push webhook → bupha watcher →
  detached worktree → per-repo pipeline → commit status. Latest-wins
  supersede per repo, HMAC-verified deliveries, secrets by env-var
  NAME only.

# The declarative runtime spec — `tamias deploy` renders each
# `services[]` entry as a per-user systemd unit named
# `<provider.name>-<service>` (`bupha-watch.service`,
# `bupha-worker.service`). TWO services, one per ingress mode
# (ADR-0007):
#   * `watch`  — the standalone/dev watcher: bupha's own webhook
#     listener (`provider.ingress`) → queue → pipeline. Enable this
#     on hosts with no peregrin.
#   * `worker` — the substrate/production consumer (P-002): polls
#     `kind="ci-job"` entities on the hypha/peregrin node
#     (`[worker] node` + `node_token_env` in fleet.toml) and runs
#     them through the same pipeline. Enable this where the
#     ci-ingress campaign owns webhook ingress — do NOT enable both
#     (the watcher's listener would fight the campaign's for the
#     same port, and a push would run twice).
provider:
  name: bupha
  services:
    # The watcher: one listener + queue + runner for the whole fleet.
    # `--config` points at the per-bundle operator config the deploy
    # driver generates — the fleet itself lives in the payload's
    # fleet.toml, never in this unit file.
    - name: watch
      # The driver binary hosts the engine in-process (`host` verb,
      # bupha T-052) — exec it from tamias's drivers dir, NOT a
      # cargo-installed `bupha` (ADR-0006: no user-facing CLI on the
      # host path). Install the driver to
      # ~/.local/share/tamias/drivers/ (or set TAMIAS_HOME) — a
      # bare `tamias-driver-bupha` won't resolve under systemd's
      # minimal PATH.
      exec: >-
        ~/.local/share/tamias/drivers/tamias-driver-bupha host --config ~/.config/bupha/bundles/ci-gate.toml
      # Secrets resolve env → cuora (`cuora://bupha/<NAME>`,
      # canonical, T-056/T-059) → `~/.config/bupha/env` (dev-mode /
      # no-cuora fallback; keyring leg dropped post-T-077). Fleet
      # secrets don't use that fallback — every one lives in the
      # cuora vault, so no `env_file:` here. The
      # watcher still needs `cuora` on PATH (systemd's minimal
      # PATH — same caveat as the driver binary above).
      workdir: "~"
      restart: on-failure
    # The entity-plane worker (T-064): claims pending `ci-job`
    # entities whose keys this fleet's [[repo]] set covers, runs
    # them through the same pipeline `host` uses, and reports
    # ci.complete back to the node. Same operator config, same
    # secret chain — `[worker] node`/`node_token_env` in fleet.toml
    # point it at the peregrin node.
    - name: worker
      exec: >-
        ~/.local/share/tamias/drivers/tamias-driver-bupha worker --config ~/.config/bupha/bundles/ci-gate.toml
      workdir: "~"
      restart: on-failure
  ingress:
    # STANDALONE MODE (ADR-0007): this block wires the bupha webhook
    # listener — the fallback ingress for deployments with no
    # peregrin. Production webhook/forge ingress is a peregrin
    # campaign listener normalizing deliveries and enqueuing
    # `ci-job` via `ci.enqueue`; the org gate already runs that way.
    # Declarative only — forge-hook *registration* is the deploy
    # driver's job (`tamias driver exec ci-gate hooks register`);
    # nothing here performs live registration. `public_url` is also
    # what deploy writes into `tunnel.public_url`, and `listen` into
    # `trigger.listen` — the manifest is the single source of truth
    # for the wiring. `path` must be `/hook` (the only route
    # bupha-webhook serves).
    - public_url: https://ci.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks:
        - forge: github
          repo: 9aia/bupha
          events: [push]
        - forge: github
          repo: 9aia/tamias
          events: [push]
        - forge: github
          repo: 9aia/myco
          events: [push]
  # Advisory verb hints for `tamias provider list`/`tamias run`.
  verbs: [run, logs, health]
