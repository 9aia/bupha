[runner]
kind = "shell"
token_env = "BUPHA_TOKEN"
cancel_running = true
# Default gate for repos without a [repo.runner] override —
# workflows/gate.yaml (the handl-gates bundle campaign, verdict via
# run-result .conclusion) when the repo carries one; ci.sh fallback
# for unmigrated repos. Artifacts land under
# ~/.local/share/bupha/gate-results/<owner>/<repo>/ — keyed by the
# origin remote (stable across per-sha worktrees), never inside the
# worktree.
cmd = "REPO=\"$(git remote get-url origin 2>/dev/null | sed -E 's#^(git@[^:]+:|(https?|ssh)://[^/]+/)##; s#\\.git$##')\"; case \"$REPO\" in *://*|/*|.*) REPO=\"$(basename \"$PWD\")\";; esac; RDIR=\"$HOME/.local/share/bupha/gate-results/$REPO\"; mkdir -p \"$RDIR\"; if [ -f workflows/gate.yaml ]; then GATE_REPO=\"$PWD\" GATE_RESULTS=\"$RDIR/results.jsonl\" \"$HOME/.local/bin/peregrin\" campaign run workflows/gate.yaml --result \"$RDIR/result.json\" >/dev/null 2>&1 && jq -e '.conclusion == \"success\"' \"$RDIR/result.json\" >/dev/null; elif [ -f ci.sh ]; then bash ci.sh; else echo \"no workflows/gate.yaml or ci.sh\"; exit 1; fi"

# Commit statuses post back to github under this context
# (per-job contexts become "<context>/<job>").
[status]
kind = "github"
context = "ci/bupha"

# No [queue] section: the dev/single-box queue store defaults to the
# JSON file under worktree.base (T-049 retired redb/redis). Durable
# queue state is the ci-job entity plane — LEGACY (ADR-0006):
# queue/cache/locks are substrate-owned (bupha T-049/051).

# Detached worktrees for runs — kept under $HOME, not /tmp, so a
# reboot doesn't strand in-flight checkouts.
# LEGACY (ADR-0006): worktree cache is substrate-owned — migrates with T-049.
[worktree]
base = "~/.local/share/bupha/worktrees"

# --- entity-plane worker (P-002/T-064) -----------------------------------------
#
# Read only by `tamias-driver-bupha worker` — the bundle's second
# service (`bupha-worker.service`), which claims `kind="ci-job"`
# entities on the hypha/peregrin node and runs them through the same
# pipeline `host` uses. `host` ignores this section, so it is safe
# to keep in the shared operator config. Both services consume the
# same generated bundles/ci-gate.toml.
[worker]
# Hypha/peregrin node base URL — where the ci-ingress campaign's
# enqueued ci-job entities live. The org node is `peregrin serve`
# on :18787 (PEREGRIN_NODE_URL default; matches the live
# peregrin-node.service). `BUPHA_WORKER_NODE`/`--node` override.
node = "http://127.0.0.1:18787"
# Env-var NAME holding the node's bearer credential — the VALUE
# never lands here; it resolves through the usual chain (env →
# cuora `cuora://bupha/PEREGRIN_TOKEN` →
# ~/.config/bupha/env). `peregrin pair`/`hypha pair` mints the
# token. The live node binds 0.0.0.0 and requires it; a loopback
# dev node may drop this line (unauthenticated).
node_token_env = "PEREGRIN_TOKEN"
# Full `ci.job.completed` ingest URL — retargets the emit off the
# entity node's ingest (which reaches kind="campaign" entities but
# NOT campaigns supervised by `peregrin campaign serve`). Points at
# the campaign serve shared listener's /api/events/inject route
# (peregrin commit 399947d6; bearer-gated on the same
# PEREGRIN_TOKEN). `BUPHA_WORKER_EVENTS_URL`/`--events-url` override.
events_url = "http://127.0.0.1:29173/api/events/inject"
# Private-fork git credential for fork-PR ci-jobs (T-073 remainder):
# a fork of a private repo is itself private, so `git fetch
# <cloneUrl>` needs auth the box's origin machinery may not provide.
# Uncomment + `cuora put cuora://bupha/BUPHA_FORK_GIT_TOKEN` (a PAT
# that reads the forks — a fine-grained PAT covering base org + forks
# works for both) to attach a generated git credential-helper to
# fork fetches only. The value never lands in this file, argv, the
# worker env, or job env — the helper re-resolves the NAME at fetch
# time. Absent = fork fetches ride the box's existing git auth
# (credential helpers / insteadOf / gh auth setup-git); public forks
# need nothing.
# fork_token_env = "BUPHA_FORK_GIT_TOKEN"
# Fleet routing labels this worker advertises — a ci-job whose
# `runs_on` requirements aren't all listed here is never claimed.
# Empty = claim every job whose key this fleet covers.
# labels = []

# `tunnel.public_url`, `trigger.listen`, `trigger.kind` are written
# by `tamias deploy` from provider.ingress — do not set them here.
# `tunnel.provider` stays "none": the public URL is fronted by the
# org's external tunnel, not a bupha-spawned cloudflared.
