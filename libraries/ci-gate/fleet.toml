# ci-gate fleet — the operator config `tamias-driver-bupha host` runs.
#
# This file is the payload's fleet source: `tamias-driver-bupha
# deploy` merges it with tamias.yaml's provider.ingress (which owns
# `tunnel.public_url`, `trigger.listen`/`kind`) and writes the result
# to ~/.config/bupha/bundles/ci-gate.toml. It is a COMPLETE
# bupha_core::Config doc — every section the `host` verb's
# `--config` load needs is here; only the two manifest-owned
# fields are absent.
#
# Secrets are env-var NAMES only — never put a value in this file.
# Canonical resolution (T-056/T-059): process env → cuora broker
# (`cuora://bupha/<NAME>` via the `cuora` CLI — sealed, audited) →
# ~/.config/bupha/env (the dev-mode / no-cuora fallback; the
# OS-keyring leg was dropped post-T-077 — `deploy env` migrates
# pre-cuora keyring entries into cuora). Migration is DONE (T-059): every fleet secret —
# the BUPHA_WH_*/BUPHA_TOKEN/BUPHA_WEBHOOK_SECRET names below plus
# PEREGRIN_TOKEN for the worker — lives in the cuora vault, and the
# ~/.config/bupha/env file is retired (no `env_file:` in
# tamias.yaml). To (re)store a value:
#   printf '%s' "$VALUE" | cuora put cuora://bupha/<NAME>
#
# Representative fleet — the full org import is a separate
# workstream; drop the generated [[repo]] set in here when it lands.

# --- fleet -------------------------------------------------------------------

[[repo]]
name = "9aia/bupha"
dir = "~/GitHub/9aia/workspace/repos/bupha"
branch = "refs/heads/main"
secret_env = "BUPHA_WH_9AIA_BUPHA"
retry = 3
# This stays the bare `9aia/bupha` lane — the docs-branch deploy is a
# separate `9aia/bupha:docs` job lane owned by the docs-deploy
# bundle's fleet.toml ([[repo.jobs]], T-030), never a second
# [[repo]] here (duplicate names are rejected by Config::watched).
# Runner override: the repo's gate lives at scripts/ci.sh — the
# cargo floor (fmt + clippy -D warnings + workspace tests; no xtask)
# plus the org docs contract (scripts/docs-check.sh → cypera check +
# docs/ drift). Same shape as the 9aia repos' scripts/ci.sh gates.
[repo.runner]
kind = "shell"
token_env = "BUPHA_TOKEN"
cancel_running = true
cmd = "bash scripts/ci.sh"

[[repo]]
name = "9aia/tamias"
dir = "~/GitHub/9aia/workspace/repos/tamias"
branch = "refs/heads/main"
secret_env = "BUPHA_WH_9AIA_TAMIAS"
retry = 3
# PR CI for the pr-heal dogfood (PL-015): pull_request jobs so the
# campaign's ci.enqueue.pr is accepted; runner override because
# tamias keeps its script at scripts/ci.sh, not ./ci.sh.
events = ["push", "pull_request"]
[repo.runner]
kind = "shell"
token_env = "BUPHA_TOKEN"
cancel_running = true
cmd = "bash scripts/ci.sh"

