name = "handl-lang/gamekit"
dir = "/home/luis/GitHub/handl-lang/gamekit"
secret_env = "BUPHA_WH_HANDL_LANG_GAMEKIT"
# Runner override: no ci.sh — the gate is the repo's own verification
# ladder (AGENTS.md / .github/workflows/ci.yml) run natively: uv sync
# dev group, ruff lint+format, ty, vulture, the import-linter contract,
# then the suite under the pyproject coverage floor. `ty` is scoped to
# packages/gamekit on purpose: `uv sync --group dev` installs only the
# root + gamekit (benchkit's torch/jinja2/plotly/polars deps stay out —
# the CUDA torch stack does not fit this host's disk), so an unscoped
# `ty check` reports unresolved benchkit imports. That is also why the
# upstream GH gate is red at HEAD — this scope keeps the kernel gate
# honest without the benchkit dep tree.
[repo.runner]
kind = "shell"
token_env = "BUPHA_TOKEN"
cancel_running = true
cmd = "export PATH=\"$HOME/.local/bin:$HOME/.cargo/bin:$PATH\" && uv sync --group dev && .venv/bin/ruff check packages && .venv/bin/ruff format --check packages && .venv/bin/ty check packages/gamekit && .venv/bin/vulture packages && .venv/bin/lint-imports && .venv/bin/coverage run --source=gamekit -m pytest tests/ -q && .venv/bin/coverage report -m"

[[repo]]
name = "handl-lang/graphopt"
dir = "/home/luis/GitHub/handl-lang/graphopt"
secret_env = "BUPHA_WH_HANDL_LANG_GRAPHOPT"
# Runner override: the worktree has no .venv (uv-managed, gitignored) —
# provision it first. `uv sync --frozen` needs no auth: the git deps
# (eqsat/gamekit packages/*) are git+https on PUBLIC repos. The `dev`
# dependency-group is a uv default group, so a bare sync installs
# ruff/pytest/ty/etc. that scripts/gates.sh calls via .venv/bin/*.
[repo.runner]
kind = "shell"
token_env = "BUPHA_TOKEN"
cancel_running = true
cmd = "export PATH=\"$HOME/.local/bin:$HOME/.cargo/bin:$PATH\" && uv sync --frozen && TORCHINDUCTOR_COMPILE_THREADS=1 bash scripts/gates.sh && TORCHINDUCTOR_COMPILE_THREADS=1 bash ci.sh"

