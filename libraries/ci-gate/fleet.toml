# ci-gate fleet — the operator config `tamias-driver-bupha host` runs.
#
# This file is the payload's fleet source: `tamias-driver-bupha
# deploy` merges it with tamias.yaml's provider.ingress (which owns
# `tunnel.public_url`, `trigger.listen`/`kind`) and writes the result
# to ~/.config/bupha/bundles/ci-gate.toml. It is a COMPLETE
# bupha_core::Config doc — every section the `host` verb's
# `--config` load needs is here; only the two manifest-owned
# fields are absent.
#
# Secrets are env-var NAMES only — never put a value in this file.
# Canonical resolution (T-056): process env → cuora broker
# (`cuora://bupha/<NAME>` via the `cuora` CLI — sealed, audited) →
# OS keyring → ~/.config/bupha/env (both LEGACY fallbacks for hosts
# without cuora). Migrate a value with
#   printf '%s' "$VALUE" | cuora put cuora://bupha/<NAME>
# then drop it from the env file; the env file + `env_file:` in
# tamias.yaml stay only as the no-cuora fallback.
#
# Representative fleet — the full org import is a separate
# workstream; drop the generated [[repo]] set in here when it lands.

# --- fleet -------------------------------------------------------------------

[[repo]]
name = "9aia/bupha"
dir = "~/GitHub/9aia/workspace/repos/bupha"
branch = "refs/heads/main"
secret_env = "BUPHA_WH_9AIA_BUPHA"

[[repo]]
name = "9aia/tamias"
dir = "~/GitHub/9aia/workspace/repos/tamias"
branch = "refs/heads/main"
secret_env = "BUPHA_WH_9AIA_TAMIAS"

[[repo]]
name = "9aia/myco"
dir = "~/GitHub/9aia/workspace/repos/myco"
branch = "refs/heads/main"
secret_env = "BUPHA_WH_9AIA_MYCO"

# --- pipeline ------------------------------------------------------------------

# The zero-container path: `bash -c <cmd>` in a detached worktree.
# Per-repo [repo.runner] tables replace this for repos that need
# dagger/ssh/http instead. `cancel_running` gives latest-wins
# supersede semantics (rejected with queue = "all").
# LEGACY (ADR-0006): cancel_running/lease semantics are queue policy —
# home TBD (ci-job contract, bupha T-051). Runner KIND stays bupha's.
[runner]
kind = "shell"
token_env = "BUPHA_TOKEN"
cancel_running = true

# Commit statuses post back to github under this context
# (per-job contexts become "<context>/<job>").
[status]
kind = "github"
context = "ci/bupha"

# Embedded ACIC store — survives watcher restarts; redis is the
# multi-box fleet option ([queue] kind = "redis").
# LEGACY (ADR-0006): queue/cache/locks are substrate-owned —
# this section migrates to the ci-job/hypha path (bupha T-049/051).
[queue]
kind = "redb"

# Detached worktrees for runs — kept under $HOME, not /tmp, so a
# reboot doesn't strand in-flight checkouts.
# LEGACY (ADR-0006): worktree cache is substrate-owned — migrates with T-049.
[worktree]
base = "~/.local/share/bupha/worktrees"

# --- entity-plane worker (P-002/T-064) -----------------------------------------
#
# Read only by `tamias-driver-bupha worker` — the bundle's second
# service (`bupha-worker.service`), which claims `kind="ci-job"`
# entities on the hypha/peregrin node and runs them through the same
# pipeline `host` uses. `host` ignores this section, so it is safe
# to keep in the shared operator config. Both services consume the
# same generated bundles/ci-gate.toml.
[worker]
# Hypha/peregrin node base URL — where the ci-ingress campaign's
# enqueued ci-job entities live. The org node is `peregrin serve`
# on :18787 (PEREGRIN_NODE_URL default; matches the live
# peregrin-node.service). `BUPHA_WORKER_NODE`/`--node` override.
node = "http://127.0.0.1:18787"
# Env-var NAME holding the node's bearer credential — the VALUE
# never lands here; it resolves through the usual chain (env →
# cuora `cuora://bupha/PEREGRIN_TOKEN` → keyring →
# ~/.config/bupha/env). `peregrin pair`/`hypha pair` mints the
# token. The live node binds 0.0.0.0 and requires it; a loopback
# dev node may drop this line (unauthenticated).
node_token_env = "PEREGRIN_TOKEN"
# Fleet routing labels this worker advertises — a ci-job whose
# `runs_on` requirements aren't all listed here is never claimed.
# Empty = claim every job whose key this fleet covers.
# labels = []

# `tunnel.public_url`, `trigger.listen`, `trigger.kind` are written
# by `tamias deploy` from provider.ingress — do not set them here.
# `tunnel.provider` stays "none": the public URL is fronted by the
# org's external tunnel, not a bupha-spawned cloudflared.
