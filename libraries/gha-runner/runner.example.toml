# gha-runner config — copy to ~/.config/bupha/gha-runner.toml.
# Every field is bupha-gha-runner::Config; see
# crates/bupha-gha-runner/src/lib.rs module docs for the full
# contract. Secrets are env-var/file NAMES only — never values.
# NOTE: no `~` expansion — paths are literal; relative paths anchor
# at the config file's directory. Use absolute paths.

repo = "owner/repo"                    # the ONE repo this runner serves
name = "bupha-builder-1"               # runner list label
labels = ["linux", "x64"]              # extra labels on top of self-hosted/OS/arch/bupha
instance = "github.com"                # or a GHES host
token_env = "BUPHA_GHA_RUNNER_TOKEN"   # registration-token env NAME (settings UI / config.sh token)
# token_file = "~/.config/bupha/gha-runner.token"  # alternative: file holding the token
# pat_env = "GITHUB_PAT"                # optional: PAT that mints a registration token instead
credentials = "~/.config/bupha/gha-runner.credentials.json"  # persisted after first registration
workdir = "~/.local/share/bupha/gha-runner-work"             # per-job workspaces
# max_parallelism = 1                   # informational — one job at a time today
