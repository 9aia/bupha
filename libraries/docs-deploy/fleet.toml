# docs-deploy fleet — the operator config `tamias-driver-bupha host` runs.
#
# This file is the payload's fleet source: `tamias-driver-bupha
# deploy` merges it with tamias.yaml's provider.ingress (which owns
# `tunnel.public_url`, `trigger.listen`/`kind`) and writes the result
# to ~/.config/bupha/bundles/docs-deploy.toml. It is a COMPLETE
# bupha_core::Config doc — every section the `host` verb's
# `--config` load needs is here; only the two manifest-owned
# fields are absent.
#
# Secrets are env-var NAMES only — never put a value in this file.
# Canonical resolution (T-056/T-059): process env → cuora broker
# (`cuora://bupha/<NAME>` via the `cuora` CLI — sealed, audited) →
# OS keyring → ~/.config/bupha/env (both LEGACY fallbacks for hosts
# without cuora). Migration is DONE (T-059): every fleet secret
# lives in the cuora vault and the ~/.config/bupha/env file is
# retired (no `env_file:` in tamias.yaml). To (re)store a value:
#   printf '%s' "$VALUE" | cuora put cuora://bupha/<NAME>
#
# v1 scope: one concrete repo (9aia/bupha — its docs branch carries
# scripts/deploy-docs.sh) plus a commented template. The full
# org-repo import is a separate workstream; uncomment + fill the
# template block per repo when it lands. Every repo needs a
# `hooks[]` entry in tamias.yaml AND a `cuora://bupha/BUPHA_WH_<OWNER>_<REPO>`
# secret in the cuora vault (canonical, T-056/T-059 — the
# ~/.config/bupha/env file is retired) before its pushes verify.

# --- fleet -------------------------------------------------------------------

[[repo]]
name = "9aia/bupha"
dir = "~/GitHub/9aia/workspace/repos/bupha"
# The docs orphan branch IS the site checkout — pushes to it are
# the deploy trigger. Main-branch pushes on this repo are filtered
# out here (ci-gate's watcher owns refs/heads/main).
branch = "refs/heads/docs"
secret_env = "BUPHA_WH_9AIA_BUPHA"

# Template for additional docs-deploy repos — uncomment one block
# per repo. Conventions:
#   * `branch` stays refs/heads/docs (9aia.github.io is the odd one
#     out — its site IS main, so use refs/heads/main there).
#   * `cmd` is the repo's own deploy script at the docs-worktree
#     root. Repos whose docs:deploy needs the main checkout for gen
#     steps (cargo doc etc.) must export BUPHA_REPO=<main clone
#     path> — bupha's worktree only contains the docs branch.
#   * self-contained repos (site checkout = docs branch root) can
#     use the plain `bun install && bun run docs:deploy` shape
#     instead of a script.
#
# [[repo]]
# name = "9aia/<repo>"
# dir = "~/GitHub/9aia/workspace/repos/<repo>"
# branch = "refs/heads/docs"
# secret_env = "BUPHA_WH_9AIA_<REPO>"

# --- pipeline ------------------------------------------------------------------

# The zero-container path: `bash -c <cmd>` in a detached worktree
# of the pushed docs sha. Global default for every [[repo]]; a repo
# whose deploy command differs overrides with its own
# [repo.runner] table (a full table replaces this one).
# LEGACY (ADR-0006): cancel_running/lease semantics are queue policy —
# home TBD (ci-job contract, bupha T-051). Runner KIND stays bupha's.
[runner]
kind = "shell"
cmd = "bash scripts/deploy-docs.sh"
token_env = "BUPHA_TOKEN"
cancel_running = true

# Commit statuses post back to github under this context —
# `docs/deploy`, matching the context the retired GHA deploy
# workflows and the peregrin docs-deploy campaign used, so the
# status history reads the same either way.
[status]
kind = "github"
context = "docs/deploy"

# No [queue] section: the dev/single-box queue store defaults to the
# JSON file under worktree.base (T-049 retired redb/redis). Durable
# queue state is the ci-job entity plane — LEGACY (ADR-0006):
# queue/cache/locks are substrate-owned (bupha T-049/051).

# Detached worktrees for runs — kept under $HOME, not /tmp, so a
# reboot doesn't strand in-flight checkouts.
# LEGACY (ADR-0006): worktree cache is substrate-owned — migrates with T-049.
[worktree]
base = "~/.local/share/bupha/worktrees-docs"

# --- entity-plane worker (P-002/T-064) -----------------------------------------
#
# Read only by `tamias-driver-bupha worker` — the bundle's second
# service (`bupha-worker-docs.service`), which claims `kind="ci-job"`
# entities on the hypha/peregrin node and runs them through the same
# pipeline `host` uses. Its claim filter is built from THIS fleet's
# [[repo]] keys, so it only picks up docs-deploy jobs off the shared
# ci-job plane (ci-gate's `bupha-worker.service` covers the rest).
# `host` ignores this section.
[worker]
# Hypha/peregrin node base URL — same org node ci-gate's worker
# polls (`peregrin serve` on :18787). `BUPHA_WORKER_NODE`/`--node`
# override.
node = "http://127.0.0.1:18787"
# Env-var NAME holding the node's bearer credential — value via the
# usual chain (env → cuora `cuora://bupha/PEREGRIN_TOKEN` → keyring
# → ~/.config/bupha/env). See ci-gate's fleet.toml for the full
# note; drop the line only for unauthenticated dev nodes.
node_token_env = "PEREGRIN_TOKEN"

# `tunnel.public_url`, `trigger.listen`, `trigger.kind` are written
# by `tamias deploy` from provider.ingress — do not set them here.
# `tunnel.provider` stays "none": the public URL is fronted by the
# org's external tunnel, not a bupha-spawned cloudflared.
