# docs-deploy — docs-site deployment as a tamias `bupha` bundle.
#
# `tamias install <ref>` fetches this payload; `tamias deploy
# docs-deploy` renders the provider units (`bupha-watch-docs.service`
# running `tamias-driver-bupha host --config
# ~/.config/bupha/bundles/docs-deploy.toml` for standalone mode,
# `bupha-worker-docs.service` running the `worker` verb against the
# same config for the peregrin substrate path) and
# `tamias-driver-bupha deploy` writes that operator config from
# `fleet.toml` + this manifest's `provider.ingress` block.
# `tamias driver exec docs-deploy hooks register` points the declared
# GitHub webhooks at the public URL.
#
# This is a SECOND watcher, deliberately separate from ci-gate's
# `bupha-watch.service`: different listen port, different bundle
# config, different branch filter. Both receive every push to a
# watched repo — each keeps only the refs its [[repo]] entries name
# (docs branch here, main there), so the overlap costs a filtered
# delivery, not a double run.
name: docs-deploy
version: "0.1.1"
type: bupha
description: >-
  Push to refs/heads/docs → detached worktree at the pushed sha →
  the repo's own deploy script (vitepress build → gh-pages) →
  docs/deploy commit status. Latest-wins supersede per repo,
  HMAC-verified deliveries, secrets by env-var NAME only. The
  bupha-native replacement for the deleted GHA deploy.yml
  workflows.

# The declarative runtime spec — `tamias deploy` renders each
# `services[]` entry as a per-user systemd unit named
# `<provider.name>-<service>` (`bupha-watch-docs.service` /
# `bupha-worker-docs.service` — NOT `bupha-watch.service` /
# `bupha-worker.service`, which belong to the ci-gate bundle; the
# service name is what keeps the two fleets distinct). TWO services,
# one per ingress mode (ADR-0007): `watch-docs` is the standalone/
# dev watcher (this bundle's own webhook listener); `worker-docs` is
# the substrate/production consumer (P-002) — it polls `ci-job`
# entities on the peregrin node and only claims keys this fleet's
# [[repo]] set covers. Enable ONE: the watcher's listener would
# fight the ci-ingress campaign's for the port, and a push would run
# twice.
provider:
  name: bupha
  services:
    # The watcher: one listener + queue + runner for the docs
    # fleet. `--config` points at the per-bundle operator config the
    # deploy driver generates — the fleet itself lives in the
    # payload's fleet.toml, never in this unit file.
    - name: watch-docs
      # The driver binary hosts the engine in-process (`host` verb,
      # bupha T-052) — exec it from tamias's drivers dir, NOT a
      # cargo-installed `bupha` (ADR-0006: no user-facing CLI on the
      # host path). Install the driver to
      # ~/.local/share/tamias/drivers/ (or set TAMIAS_HOME) — a
      # bare `tamias-driver-bupha` won't resolve under systemd's
      # minimal PATH.
      exec: >-
        ~/.local/share/tamias/drivers/tamias-driver-bupha host --config ~/.config/bupha/bundles/docs-deploy.toml
      # Secrets resolve env → cuora (`cuora://bupha/<NAME>`,
      # canonical, T-056/T-059) → keyring. The legacy
      # `~/.config/bupha/env` file is retired — every fleet secret
      # lives in the cuora vault, so no `env_file:` here. The
      # watcher still needs `cuora` on PATH (systemd's minimal
      # PATH — same caveat as the driver binary above).
      workdir: "~"
      restart: on-failure
    # The entity-plane worker (T-064): same `worker` verb ci-gate's
    # `bupha-worker.service` runs, pointed at THIS bundle's operator
    # config — its claim filter is built from docs-deploy's
    # [[repo.jobs]] keys (`<repo>:docs`, T-030), so it only picks up
    # docs-deploy jobs off the shared ci-job plane.
    - name: worker-docs
      exec: >-
        ~/.local/share/tamias/drivers/tamias-driver-bupha worker --config ~/.config/bupha/bundles/docs-deploy.toml
      workdir: "~"
      restart: on-failure
  ingress:
    # STANDALONE MODE (ADR-0007): this block wires the bupha webhook
    # listener — the fallback ingress for deployments with no
    # peregrin. Production webhook/forge ingress is a peregrin
    # campaign listener normalizing deliveries and enqueuing
    # `ci-job` via `ci.enqueue`.
    # Declarative only — forge-hook *registration* is the deploy
    # driver's job (`tamias driver exec docs-deploy hooks register`);
    # nothing here performs live registration. `public_url` is also
    # what deploy writes into `tunnel.public_url`, and `listen` into
    # `trigger.listen` — the manifest is the single source of truth
    # for the wiring. `path` must be `/hook` (the only route
    # bupha-webhook serves). The port is deliberately NOT ci-gate's
    # 29173 — two watchers, two listeners.
    - public_url: https://docs-deploy.luisfuturist.com
      listen: 127.0.0.1:29174
      path: /hook
      hooks:
        - forge: github
          repo: 9aia/bupha
          events: [push]
        # Add one hooks[] entry per [[repo]] you enable in
        # fleet.toml — `hooks register` manages exactly this set.
  # Advisory verb hints for `tamias provider list`/`tamias run`.
  verbs: [run, logs, health]
