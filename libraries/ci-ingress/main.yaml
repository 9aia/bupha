# --- routing: raw events → typed `{type}.{repo}.{ref}.{url}.{sha}` ---
# The catch-all enqueues below don't need this, but per-repo enqueue
# nodes subscribe the typed kinds (ci-gate's ci.route precedent).
# `${event.type}` keeps push and pull_request kinds distinct;
# `event.match.1` = clone_url, `event.match.2` = sha (same positions
# for both — see ci.enqueue.pr for the PR ref convention).
- id: ci.route
  driver: shell
  on:
  - push
  - pull_request
  max_fires: unlimited
  emits:
  - push.**
  - pull_request.**
  - route.unmatched
  params:
    cmd: 'true'
    emit:
      '0': "${event.type}.${event.payload.repo}.${event.payload.ref}.${event.payload.clone_url}.${event.payload.sha}"
      default: route.unmatched

# --- enqueue: push → POST /api/entities (kind="ci-job") -----------------
# `key` is the worker fleet.toml `[[repo]] key` the job resolves
# against — repo full_name for whole-repo gates (`owner/name`),
# `owner/name:job` for per-job lanes. `deliveryId` carries
# X-GitHub-Delivery for audit (the deterministic entity id already
# dedups replays). `retries` re-POSTs on transport failure/5xx —
# safe because create is idempotent on the entity id. Against the
# hub a queued create answers 202 `{queued:true}` — `http.done`,
# the job lands when the node returns.
- id: ci.enqueue
  driver: http
  on:
  - push
  max_fires: unlimited
  emits:
  - http.done
  - http.failed
  params:
    url: "${config.api_url}/api/entities"
    method: POST
    timeout: 30
    retries: 3
    headers:
      authorization: "Bearer ${secret.PEREGRIN_HUB_TOKEN}"
      content-type: application/json
    body:
      kind: ci-job
      indexDoc:
        key: "${event.payload.repo}"
        repo: "${event.payload.repo}"
        ref: "${event.payload.ref}"
        sha: "${event.payload.sha}"
        event: push
        sender: "${event.payload.actor}"
        deliveryId: "${event.payload.delivery_id}"
        queue: "${config.queue}"
        context: "${config.context}"

# --- enqueue: pull_request → POST /api/entities (kind="ci-job") ---------
# bupha-trigger's PR convention: the job runs the PR *head* sha but
# gates on the *base* branch — `ref` is `refs/heads/<base_ref>`, the
# same ref a push to that branch would carry, so one `[[repo]]
# branch` + `events = ["push", "pull_request"]` entry covers both.
# Repos that didn't opt into pull_request never match a fleet spec's
# `events` — a spec-armed plane rejects the create (400 → http.failed
# in the log) instead of leaving an unclaimable job pending.
#
# Fork heads (T-073/bupha): `cloneUrl`/`headRef` carry the head
# repo's clone URL + head ref — the driver emits `head_clone_url`
# ONLY for fork deliveries (`fork` flag / head-repo mismatch), ""
# otherwise, which the plane normalizes to absent. `headRef` is the
# head branch name (`event.payload.ref`); the worker fetches
# `cloneUrl` first, then the bare sha, then the repo's own remote —
# pushes and same-repo PRs leave both fields empty/absent and keep
# the old single-remote checkout.
- id: ci.enqueue.pr
  driver: http
  on:
  - pull_request
  max_fires: unlimited
  emits:
  - http.done
  - http.failed
  params:
    url: "${config.api_url}/api/entities"
    method: POST
    timeout: 30
    retries: 3
    headers:
      authorization: "Bearer ${secret.PEREGRIN_HUB_TOKEN}"
      content-type: application/json
    body:
      kind: ci-job
      indexDoc:
        key: "${event.payload.repo}"
        repo: "${event.payload.repo}"
        ref: "refs/heads/${event.payload.base_ref}"
        sha: "${event.payload.sha}"
        event: pull_request
        cloneUrl: "${event.payload.head_clone_url}"
        headRef: "${event.payload.ref}"
        sender: "${event.payload.actor}"
        deliveryId: "${event.payload.delivery_id}"
        queue: "${config.queue}"
        context: "${config.context}"

# --- enqueue: per-job lanes (`owner/name:job`, T-030) ------------------
# `on:` matches event types only (no payload expressions), so a job
# lane subscribes the TYPED event `ci.route` emits —
# `push.<repo>.<ref>.<clone_url>.<sha>` pinned to the job's branch
# (`**` re-joins clone_url's `.`-separated segments, the trailing `*`
# is the sha → `${event.match.2}`). One node per lane: `key`/`ref`
# are literals because the typed event's payload is the router's
# `{stdout, rc, cmd}`, not the webhook payload — `sender`/
# `deliveryId` don't survive the hop (the deterministic entity id
# `ci:{key}:{sha}:{attempt}` still dedups replays, and a spec-armed
# plane overwrites queue/context/runner from the fleet spec anyway).
#
# The raw-push `ci.enqueue` above still sees the same delivery: its
# create resolves key `owner/name` against the repo's main-branch
# fleet spec and 400s on the ref mismatch — expected `http.failed`
# noise in the campaign log, NOT a misroute (the `:job` lane below
# is the create that lands).
#
# To add a lane: declare `[[repo.jobs]]` in the owning bupha bundle's
# fleet.toml, then copy this node with the lane's
# `push.<repo>.<branch>.**.*` `on:` pattern, `key: "<repo>:<job>"`
# and `ref: "<branch>"`.
- id: ci.enqueue.job.9aia-bupha-docs
  driver: http
  on:
  - push.9aia/bupha.refs/heads/docs.**.*
  max_fires: unlimited
  emits:
  - http.done
  - http.failed
  params:
    url: "${config.api_url}/api/entities"
    method: POST
    timeout: 30
    retries: 3
    headers:
      authorization: "Bearer ${secret.PEREGRIN_HUB_TOKEN}"
      content-type: application/json
    body:
      kind: ci-job
      indexDoc:
        key: "9aia/bupha:docs"
        repo: "9aia/bupha"
        ref: "refs/heads/docs"
        sha: "${event.match.2}"
        event: push
        queue: "${config.queue}"
        context: "${config.context}"
