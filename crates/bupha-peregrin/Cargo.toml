[package]
name = "bupha-peregrin"
description = "peregrin-side ci-job integration — entity plane composition, fleet specs, hub rehydrate, kind policy (P-047, the bupha↔hypha/peregrin seam)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

[dependencies]
bupha-plane.workspace = true
bupha-config-file.workspace = true
# The EntityPlane port lives in hypha-http; the rehydrate client in
# hypha-node-api; the hub-side KindPolicy port in hypha-sync — git
# deps so `cargo install --git` and CI work without a sibling
# ../hypha checkout (same rule as bupha-plane's hypha-http).
hypha-http = { git = "https://github.com/9aia/hypha.git", branch = "main" }
hypha-node-api = { git = "https://github.com/9aia/hypha.git", branch = "main" }
hypha-sync = { git = "https://github.com/9aia/hypha.git", branch = "main" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
