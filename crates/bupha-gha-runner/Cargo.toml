[package]
name = "bupha-gha-runner"
description = "GitHub Actions self-hosted runner — speaks the actions/runner broker protocol so repos can runs-on: [self-hosted, bupha]"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "github-actions", "runner", "bupha"]
categories = ["development-tools"]

[dependencies]
bupha-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
serde_path_to_error = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tiny_http = "0.12"
