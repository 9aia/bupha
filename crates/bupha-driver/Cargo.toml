[package]
name = "bupha-driver"
description = "tamias-driver-bupha — pavo view driver over bupha's on-disk run/queue state (read-only)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bupha", "pavo", "driver", "ci"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-bupha"
path = "src/main.rs"

[features]
# Embedded surfaces (pavo-driver-kit's surface layer) — optional,
# acyclic: the driver gains `cli`/`mcp` argv verbs that serve its own
# ops manifest; the standalone tamias-driver-cli/-mcp binaries front
# the same ops without any feature. default = view + content-type
# driver + `ops`/`run` engine passthrough only.
default = []
cli = ["pavo-driver-kit/cli"]
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
bupha-core.workspace = true
# The engine lib — `ops` manifest derives from `bupha::command()`
# and `run`/`cli.*` re-exec through `bupha::run_from`.
bupha.workspace = true
bupha-config.workspace = true
bupha-config-file.workspace = true
bupha-queue.workspace = true
bupha-systemd.workspace = true
# tamias content-type surface (ops.rs): forge-hook REST calls reuse
# bupha-github; the secret chain reuses the same three stores
# `bupha` resolves through.
bupha-github.workspace = true
# `host` verb — the watcher engine, shared verbatim with `bupha watch`.
bupha-watch.workspace = true
bupha-secret.workspace = true
bupha-secret-cuora.workspace = true
bupha-keyring.workspace = true
bupha-dotenv.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_norway = "0.9"
toml.workspace = true
ureq = { version = "3", features = ["json"] }
# The ops manifest walks the engine's clap tree (`Arg`/`ArgAction`).
clap = { version = "4", features = ["derive"] }
# The public wire contract — git dep so `cargo install --git` and CI
# work without a sibling ../pavo checkout (bupha's CI has none;
# path deps break workspace resolution on a fresh clone).
# `version` is the crates.io fallback.
# `rev` pins the surface-driver layer (`pavo_driver_kit::surface`)
# the `cli`/`mcp` features and ops-manifest contract need.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0", rev = "1f5e37afdb0b66a1ef908c2cc2448248493399c2" }
# Driver-authoring kit — serve loop, manifest/view/node builders,
# and the `surface` layer (ops manifest → generated CLI + MCP).
# Same git-dep rule as pavo-protocol above.
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0", rev = "1f5e37afdb0b66a1ef908c2cc2448248493399c2" }

[dev-dependencies]
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-bupha serve` binary.
pavo-testkit = { git = "https://github.com/9aia/pavo", rev = "1f5e37afdb0b66a1ef908c2cc2448248493399c2" }
