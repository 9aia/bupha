[package]
name = "bupha-watch"
description = "bupha watcher engine host — trigger → queue → runner → status pipeline shared by `bupha watch` and `tamias-driver-bupha host`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

[dependencies]
bupha-core.workspace = true
lasius-vcs.workspace = true
lasius-vcs-git.workspace = true
bupha-queue.workspace = true
bupha-secret-cuora.workspace = true
# Secrets port + legacy fallback impls — hypha crates (git dep, same
# rule as hypha-node-api below; the bupha-{secret,keyring,dotenv}
# crates were retired in T-077). Keyring keeps service="bupha" so
# pre-cuora entries still resolve.
hypha-secret = { git = "https://github.com/9aia/hypha.git", branch = "main" }
hypha-keyring = { git = "https://github.com/9aia/hypha.git", branch = "main" }
hypha-dotenv = { git = "https://github.com/9aia/hypha.git", branch = "main" }
bupha-trigger.workspace = true
bupha-status.workspace = true
bupha-runner.workspace = true
bupha-dagger.workspace = true
bupha-shell.workspace = true
bupha-ssh.workspace = true
bupha-http.workspace = true
bupha-container.workspace = true
bupha-gha.workspace = true
bupha-tunnel.workspace = true
bupha-cloudflared.workspace = true
bupha-github.workspace = true
bupha-sturn.workspace = true
bupha-webhook.workspace = true
bupha-cache.workspace = true
bupha-cache-sccache.workspace = true
bupha-access.workspace = true
bupha-access-file.workspace = true
bupha-access-forge.workspace = true
bupha-audit-file.workspace = true
bupha-telemetry.workspace = true
bupha-telemetry-otel.workspace = true
bupha-history.workspace = true
bupha-plane.workspace = true
# The entity-plane worker (`entity_worker`) speaks the node↔hub
# contract — git dep so `cargo install --git` and CI work without a
# sibling ../hypha checkout (same rule as bupha-plane's hypha-http).
hypha-node-api = { git = "https://github.com/9aia/hypha.git", branch = "main" }
tokio = { version = "1", features = ["rt"] }
chrono = "0.4"
serde_json.workspace = true
bupha-attest.workspace = true
bupha-attest-file.workspace = true
bupha-attest-sigstore.workspace = true
toml.workspace = true
ureq = { version = "3", features = ["json"] }

# cargo-llvm-cov compiles with `--cfg coverage` (see coverage-gated
# test hooks in lib.rs) — declare it for check-cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
