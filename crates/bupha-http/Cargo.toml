[package]
name = "bupha-http"
description = "Runner impl: remote execution via HTTP agent (tar worktree + poll)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

[dependencies]
bupha-runner.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
bupha-runner.workspace = true
