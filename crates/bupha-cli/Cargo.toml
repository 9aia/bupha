[package]
name = "bupha"
description = "bupha — the oxpecker on your repo's back: headless CI CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

[[bin]]
name = "bupha"
path = "src/main.rs"

[dependencies]
bupha-core.workspace = true
bupha-runner.workspace = true
bupha-dagger.workspace = true
bupha-script.workspace = true
bupha-tunnel.workspace = true
bupha-cloudflared.workspace = true
bupha-github.workspace = true
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }
bupha-deploy.workspace = true
serde_json = "1"
ureq = { version = "3" }
clap-markdown = "0.1.5"

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3" }

