[package]
name = "bupha"
description = "bupha — the oxpecker on your repo's back: headless CI CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

[[bin]]
name = "bupha"
path = "src/main.rs"

[dependencies]
bupha-core.workspace = true
bupha-vcs.workspace = true
bupha-git.workspace = true
bupha-queue.workspace = true
bupha-queue-redb.workspace = true
bupha-queue-redis.workspace = true
bupha-secret.workspace = true
bupha-keyring.workspace = true
bupha-dotenv.workspace = true
bupha-service.workspace = true
bupha-config.workspace = true
bupha-cache.workspace = true
bupha-cache-sccache.workspace = true
bupha-config-toml.workspace = true
bupha-trigger.workspace = true
bupha-status.workspace = true
bupha-runner.workspace = true
bupha-dagger.workspace = true
bupha-shell.workspace = true
bupha-ssh.workspace = true
bupha-tunnel.workspace = true
bupha-cloudflared.workspace = true
bupha-github.workspace = true
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }
bupha-systemd.workspace = true
serde_json = "1"
ureq = { version = "3" }
clap-markdown = "0.1.5"
dirs = "7.0.0"
toml = "0.8"

bupha-access.workspace = true
bupha-access-file.workspace = true
bupha-access-forge.workspace = true
bupha-telemetry.workspace = true
bupha-telemetry-otel.workspace = true
bupha-container.workspace = true

bupha-history.workspace = true

bupha-attest.workspace = true

bupha-attest-file.workspace = true

bupha-attest-sigstore.workspace = true

bupha-queue-lease.workspace = true

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3" }

