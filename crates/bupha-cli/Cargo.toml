[package]
name = "bupha"
description = "bupha — queue engine for event-driven jobs: shipped as CI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

# No `[[bin]]` — the `bupha` command ships as the tamias pack in
# `libraries/bupha` (`bins[]` shim → `tamias-driver-bupha cli` →
# `bupha::run_from`, T-012). This package is the engine lib only.

[dependencies]
# The watcher engine (trigger → queue → runner → sinks) lives in
# bupha-watch — shared verbatim with `tamias-driver-bupha host`.
bupha-watch.workspace = true
bupha-core.workspace = true
lasius-vcs.workspace = true
lasius-vcs-git.workspace = true
bupha-queue.workspace = true
bupha-secret-cuora.workspace = true
# Secrets port + legacy fallback impls live in hypha now (T-077) —
# git dep, same rule as bupha-watch's hypha-node-api.
hypha-secret = { git = "https://github.com/9aia/hypha.git", branch = "main" }
hypha-keyring = { git = "https://github.com/9aia/hypha.git", branch = "main" }
# systemd unit machinery lives in hypha-systemd (T-077 — the
# bupha-{service,systemd} crates are retired); the bupha-shaped
# wrappers (unit naming, env skeleton, journalctl logs) are the
# local `deploy` module.
hypha-systemd = { git = "https://github.com/9aia/hypha.git", branch = "main" }
bupha-config-file.workspace = true
bupha-runner.workspace = true
bupha-http.workspace = true
bupha-github.workspace = true
bupha-gha-runner.workspace = true
bupha-trigger.workspace = true
bupha-telemetry.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = { version = "3" }
clap-markdown = "0.1.5"
serde_norway = "0.9"
toml = "0.8"

# cargo-llvm-cov compiles with `--cfg coverage` (see coverage-gated
# test hooks in lib.rs and the driver-hosted e2e suite) — declare
# it for check-cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
