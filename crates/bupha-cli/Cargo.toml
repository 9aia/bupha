[package]
name = "bupha"
description = "bupha — the oxpecker on your repo's back: headless CI CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bupha"
path = "src/main.rs"

[dependencies]
bupha-core = { path = "../bupha-core" }
bupha-runner = { path = "../bupha-runner" }
bupha-dagger = { path = "../bupha-dagger" }
bupha-script = { path = "../bupha-script" }
bupha-tunnel = { path = "../bupha-tunnel" }
bupha-cloudflared = { path = "../bupha-cloudflared" }
bupha-github = { path = "../bupha-github" }
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }
bupha-deploy = { path = "../bupha-deploy" }
serde_json = "1"
ureq = { version = "3" }

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3" }

keywords = ["ci", "webhook", "dagger", "automation", "headless"]
categories = ["command-line-utilities", "development-tools"]
