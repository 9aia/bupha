[package]
name = "bupha-sturn"
description = "sturn source impl: reads refs/sturn/* WAL state out of a clone via git plumbing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

[dependencies]
bupha-core.workspace = true
bupha-trigger.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
