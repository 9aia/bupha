[package]
name = "bupha-config-file"
description = "File impl of the config port — scarab-config discovery (explicit → $BUPHA_CONFIG → ./bupha.* → ~/.config/bupha/) + local TOML/YAML format dispatch for bupha_core::Config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

[dependencies]
bupha-core.workspace = true
scarab-config = { git = "ssh://git@github.com/9aia/scarab.git", rev = "9364df88fad0ca46bd838467717a823893f47438", version = "0.1" }
scarab-config-file = { git = "ssh://git@github.com/9aia/scarab.git", rev = "9364df88fad0ca46bd838467717a823893f47438", version = "0.1" }
serde_norway = "0.9"
toml.workspace = true
