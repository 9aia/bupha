[package]
name = "bupha-config-file"
description = "File impl of the config port — scarab-config discovery (explicit → $BUPHA_CONFIG → ./bupha.* → ~/.config/bupha/) + local TOML/YAML format dispatch for bupha_core::Config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ci", "bupha"]
categories = ["development-tools"]

[dependencies]
bupha-core.workspace = true
scarab-config = { git = "ssh://git@github.com/9aia/scarab.git", rev = "23b6d45da9803d737ed951300542fa837d6e7347", version = "0.2.0" }
scarab-config-file = { git = "ssh://git@github.com/9aia/scarab.git", rev = "23b6d45da9803d737ed951300542fa837d6e7347", version = "0.2.0" }
serde_yaml_ng = "0.10"
toml.workspace = true
